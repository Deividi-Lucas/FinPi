{{define "headCommon"}}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS via CDN (zero build step, ideal para Raspberry Pi) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
{{end}}

{{define "liveBanner"}}
        <!-- Aviso de atualização em tempo real (exibido só se você estiver editando algo) -->
        <div id="live-update-banner" class="hidden mt-4 p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-sm items-center justify-between gap-3">
            <span>Há novas atualizações nesta tela.</span>
            <button type="button" onclick="location.reload()" class="px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium cursor-pointer">
                Atualizar agora
            </button>
        </div>
{{end}}

{{define "liveUpdates"}}
    <script>
        // Tempo real (SSE): quando outra tela cria, edita ou exclui um lançamento, esta tela atualiza.
        // isEditing() diz se há algo em edição: nesse caso mostra o aviso em vez de recarregar e perder o que foi digitado.
        function startLiveUpdates(isEditing) {
            function refresh() {
                if (!isEditing()) {
                    location.reload();
                    return;
                }
                const banner = document.getElementById('live-update-banner');
                banner.classList.remove('hidden');
                banner.classList.add('flex');
            }

            const source = new EventSource('/events');
            let wasDisconnected = false;

            source.addEventListener('change', refresh);
            // Conexão caiu (ex.: o servidor reiniciou por uma atualização): ao voltar, recarrega a tela.
            source.onerror = function () { wasDisconnected = true; };
            source.onopen = function () {
                if (wasDisconnected) {
                    wasDisconnected = false;
                    refresh();
                }
            };
        }
    </script>
{{end}}
