name: Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-arm64:
    name: Build Linux ARM64 Binary
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Verify Dependencies
      run: go mod verify

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...

    - name: Cross-Compile for Raspberry Pi (Linux ARM64)
      env:
        GOOS: linux
        GOARCH: arm64
        CGO_ENABLED: 0
      run: |
        go build -v -ldflags="-s -w" -o finpi .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: finpi-linux-arm64
        path: finpi
        if-no-files-found: error
