name: Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build Linux ARM64 Binary
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.22'
        cache: true

    - name: Verify Dependencies
      run: go mod verify

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...

    - name: Test Pi updater script
      run: bash deploy/test-finpi-update.sh

    - name: Cross-Compile for Raspberry Pi (Linux ARM64)
      env:
        GOOS: linux
        GOARCH: arm64
        CGO_ENABLED: 0
      run: |
        go build -v -ldflags="-s -w -X main.version=build-${{ github.run_number }}" -o finpi-linux-arm64 .
        sha256sum finpi-linux-arm64 > SHA256SUMS

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: finpi-linux-arm64
        path: |
          finpi-linux-arm64
          SHA256SUMS
        if-no-files-found: error

  release:
    name: Publish Release
    needs: build-arm64
    # Só publica depois de um merge na main; PRs apenas compilam e testam.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
    - name: Download build
      uses: actions/download-artifact@v8
      with:
        name: finpi-linux-arm64
        path: dist

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "build-${{ github.run_number }}" \
          dist/finpi-linux-arm64 dist/SHA256SUMS \
          --repo "${{ github.repository }}" \
          --target "${{ github.sha }}" \
          --title "FinPi build ${{ github.run_number }}" \
          --generate-notes \
          --latest
